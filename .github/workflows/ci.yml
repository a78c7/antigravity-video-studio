name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  linux-check:
    name: Linux 隐私巡检、编译与单测
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 确保 FFmpeg 可用
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: 安装项目与测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 零隐私与防泄密巡检
        run: python3 scripts/privacy_check.py

      - name: 校验 start.sh 语法与 pyproject.toml
        run: |
          bash -n start.sh
          python3 -c "import tomllib, pathlib; data = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8')); print('project:', data['project']['name'], data['project']['version'])"

      - name: 全库 Python 语法编译检查
        run: |
          python3 - <<'PY'
          import pathlib
          import py_compile

          targets = []
          for folder in ("backend", "scripts", "tests"):
              p = pathlib.Path(folder)
              if p.exists():
                  targets.extend(sorted(p.rglob("*.py")))
          for f in targets:
              py_compile.compile(str(f), doraise=True)
          print(f"py_compile passed: {len(targets)} files")
          PY

      - name: 运行自动化冒烟与回归单测
        run: pytest -q tests/test_smoke.py

  windows-check:
    name: Windows 启动脚本与隐私巡检
    runs-on: windows-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 零隐私与防泄密巡检
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          python scripts/privacy_check.py

      - name: 校验 start.ps1 PowerShell 语法解析与编码
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $scriptPath = (Resolve-Path ".\start.ps1").Path
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors -and $parseErrors.Count -gt 0) {
              foreach ($err in $parseErrors) {
                  Write-Error "PowerShell syntax error: $($err.Message) at line $($err.Extent.StartLineNumber)"
              }
              exit 1
          }
          $bytes = [System.IO.File]::ReadAllBytes($scriptPath)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              Write-Error "start.ps1 必须保留 UTF-8 BOM 以兼容 Windows PowerShell 5.1 中文输出"
              exit 1
          }
          Write-Host "start.ps1 PowerShell AST 解析与 UTF-8 BOM 检查通过。"
