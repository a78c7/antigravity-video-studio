[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-video-studio"
version = "1.0.0"
description = "反重力视频工坊 — 面向 Google Gemini / Antigravity 订阅用户的本地 AI 短剧全流程制片台"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx[socks]>=0.28.0",
    "google-genai>=1.0.0",
    "openai>=1.60.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.18",
    "watchdog>=6.0.0",
    "python-dotenv>=1.0.1",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]
